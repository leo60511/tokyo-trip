<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>東京冬日慢旅</title>
<meta name="theme-color" content="#FFFCF6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="東京旅行">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&display=swap">
<style>
/* Layout: 手機優先單欄，最寬 720px 置中；固定頂部選單 */
:root {
  --paper: #FFFCF6;
  --ink: #3E3A39;
  --coral: #F2A497;
  --yellow: #F6D27A;
  --mizu: #A8D3E6;
  --green: #B9DAA5;
  --coral-l: #FBE3DE;
  --yellow-l: #FCF1D2;
  --mizu-l: #E3F1F7;
  --green-l: #E6F1DF;
  --ink-soft: #6E6866;
  --line: 3px solid var(--ink);
  --r-lg: 24px;
  --r-md: 16px;
  --font: "Huninn", "jf-openhuninn", "PingFang TC", "Microsoft JhengHei", sans-serif;
  --nav-h: 56px;
  color-scheme: light;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: calc(var(--nav-h) + env(safe-area-inset-top, 0px) + 12px); }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px); z-index: 60; background: var(--paper);
}
h1, h2, h3, p { margin: 0; }
h1, h2 { text-wrap: balance; }
button { font-family: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--coral); outline-offset: 3px; border-radius: 8px; }

/* ── 選單 ── */
.nav {
  position: fixed; top: env(safe-area-inset-top, 0px); left: 0; right: 0; z-index: 50;
  background: var(--paper); border-bottom: var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.nav-inner {
  max-width: 720px; margin: 0 auto; height: var(--nav-h);
  display: flex; align-items: center; gap: 10px;
}
.brand { display: flex; align-items: center; gap: 6px; font-size: 17px; white-space: nowrap; color: var(--ink); text-decoration: none; }
.brand svg { flex: none; }
.nav-links {
  margin-left: auto; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none;
  padding: 4px 2px;
}
.nav-links::-webkit-scrollbar { display: none; }
.nav-links a {
  flex: none; padding: 3px 11px; font-size: 14px;
  border: 2.5px solid var(--ink); border-radius: 999px;
  color: var(--ink); text-decoration: none; background: var(--paper);
  transition: background .15s, transform .15s;
}
.nav-links a:hover, .nav-links a.on { background: var(--yellow); }
.nav-links a:active { transform: translateY(1px); }

/* ── 版面 ── */
main {
  max-width: 752px; margin: 0 auto;
  padding-block: calc(var(--nav-h) + env(safe-area-inset-top, 0px) + 20px) 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 44px;
}
.sec-head { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
.sec-head h2 { font-size: 22px; font-weight: 400; letter-spacing: .04em; }
.sec-head .sub { margin-left: auto; font-size: 13px; color: var(--ink-soft); }
.stamp {
  width: 40px; height: 40px; flex: none; border: var(--line); border-radius: 14px;
  display: grid; place-items: center;
}
.box { border: var(--line); border-radius: var(--r-lg); background: var(--paper); }

/* ── 首頁 ── */
.hero { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 14px; }
.hero-art { width: 100%; max-width: 100%; border: var(--line); border-radius: var(--r-lg); overflow: hidden; background: var(--mizu-l); }
.hero-art svg { display: block; width: 100%; height: auto; }
.eyebrow { font-size: 13px; letter-spacing: .2em; color: var(--ink-soft); margin-top: 6px; }
.hero h1 { font-size: clamp(30px, 8vw, 44px); font-weight: 400; line-height: 1.25; letter-spacing: .04em; }
.hero h1 .hl { background: var(--yellow); border-radius: 10px; padding: 0 6px; }
.hero-meta { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; font-size: 14px; }
.chip { border: 2.5px solid var(--ink); border-radius: 999px; padding: 2px 12px; background: var(--paper); }
.countdown {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;
  width: 100%; max-width: 420px; padding: 14px; background: var(--coral-l);
}
.countdown-title { grid-column: 1 / -1; font-size: 14px; }
.cd-cell { background: var(--paper); border: 2.5px solid var(--ink); border-radius: var(--r-md); padding: 8px 0 4px; }
.cd-num { display: block; font-size: 30px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.cd-unit { font-size: 12px; color: var(--ink-soft); }
.cd-cell.big { background: var(--yellow); }

/* ── 航班 ── */
.flights { display: grid; gap: 14px; }
.flight { padding: 18px; display: flex; flex-direction: column; gap: 12px; }
.flight.out { background: var(--mizu-l); }
.flight.back { background: var(--green-l); }
.flight-top { display: flex; align-items: center; gap: 8px; font-size: 14px; flex-wrap: wrap; }
.tag {
  display: inline-flex; align-items: center; gap: 4px;
  border: 2px solid var(--ink); border-radius: 999px; padding: 0 9px;
  font-size: 12.5px; line-height: 22px; white-space: nowrap; background: var(--paper);
}
.flight-top .code { margin-left: auto; font-variant-numeric: tabular-nums; letter-spacing: .05em; }
.route { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px; }
.port { display: flex; flex-direction: column; }
.port b { font-weight: 400; font-size: 32px; line-height: 1; letter-spacing: .04em; }
.port span { font-size: 13px; color: var(--ink-soft); }
.port.r { text-align: right; }
.port .t { font-size: 17px; color: var(--ink); font-variant-numeric: tabular-nums; }
.path { position: relative; height: 24px; }
.path::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; border-top: 3px dashed var(--ink); }
.path svg { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); background: inherit; }
.flight-foot { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--ink-soft); border-top: 2px dashed var(--ink); padding-top: 10px; }
.flight-foot b { font-weight: 400; color: var(--ink); }
.tbd, .flight-foot b.tbd, .port .t.tbd { color: var(--ink-soft); text-decoration: underline dashed 2px; text-underline-offset: 4px; }

/* ── 每日行程 ── */
.days {
  display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none;
  padding: 4px 4px 8px; margin: 0 -4px 6px;
}
.days::-webkit-scrollbar { display: none; }
.day-btn {
  flex: none; width: 64px; padding: 6px 0 8px; cursor: pointer;
  border: var(--line); border-radius: 18px; background: var(--paper);
  display: flex; flex-direction: column; align-items: center; line-height: 1.2;
  transition: background .15s, transform .15s;
}
.day-btn small { font-size: 11px; color: var(--ink-soft); }
.day-btn strong { font-weight: 400; font-size: 20px; font-variant-numeric: tabular-nums; }
.day-btn .wd { font-size: 12px; }
.day-btn:hover { background: var(--yellow-l); }
.day-btn[aria-selected="true"] { background: var(--yellow); transform: translateY(-3px); }
.day-btn[aria-selected="true"] small { color: var(--ink); }

.day-card { padding: 18px 16px 6px; }
.day-head { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 16px; }
.day-head svg { flex: none; width: 64px; height: 64px; }
.day-head h3 { font-weight: 400; font-size: 20px; line-height: 1.35; }
.day-head p { font-size: 13.5px; color: var(--ink-soft); }
.day-head .city { display: inline-block; margin-bottom: 2px; }

.timeline { list-style: none; margin: 0; padding: 0; position: relative; }
.timeline::before {
  content: ""; position: absolute; left: 51px; top: 10px; bottom: 22px;
  border-left: 3px dotted var(--ink);
}
.stop { position: relative; display: grid; grid-template-columns: 40px 1fr; gap: 22px; padding-bottom: 16px; }
.stop-time { font-size: 14px; font-variant-numeric: tabular-nums; padding-top: 1px; text-align: right; }
.stop::before {
  content: ""; position: absolute; left: 45px; top: 6px;
  width: 15px; height: 15px; border: 3px solid var(--ink); border-radius: 50%;
  background: var(--paper);
}
.stop.must::before { background: var(--coral); }
.stop-body { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.stop-title { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 16.5px; }
.stop-note { font-size: 13.5px; color: var(--ink-soft); }
.stop-tags { display: flex; flex-wrap: wrap; gap: 6px; }
.must-badge {
  font-size: 12px; line-height: 20px; padding: 0 8px; border-radius: 999px;
  background: var(--coral); border: 2px solid var(--ink);
  display: inline-flex; align-items: center; gap: 3px;
}
.t-plane { background: var(--mizu); }
.t-rail { background: var(--yellow); }
.t-metro { background: var(--green); }
.t-bus { background: var(--coral-l); }
.t-walk { background: var(--paper); }
.legend { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; font-size: 13px; color: var(--ink-soft); align-items: center; }

.bounce { animation: bounce-in .55s cubic-bezier(.34, 1.56, .64, 1); }
@keyframes bounce-in {
  0% { transform: translateY(14px) scale(.96); opacity: .2; }
  60% { transform: translateY(-4px) scale(1.01); opacity: 1; }
  100% { transform: none; }
}

/* ── 待辦＋住宿 ── */
.two { display: grid; gap: 14px; }
.panel { padding: 16px 16px 12px; }
.panel h3 { font-weight: 400; font-size: 17px; display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.panel h3 .count { margin-left: auto; font-size: 13px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.progress { height: 12px; border: 2.5px solid var(--ink); border-radius: 999px; overflow: hidden; margin-bottom: 10px; background: var(--paper); }
.progress i { display: block; height: 100%; width: 0; background: var(--green); border-right: 2.5px solid var(--ink); transition: width .3s; }
.progress i[style="width: 0%;"] { border-right: 0; }

.checks { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.check { display: flex; align-items: flex-start; gap: 10px; padding: 7px 0; cursor: pointer; font-size: 15px; border-bottom: 2px dashed #E3DDD3; }
.checks li:last-child .check { border-bottom: 0; }
.check input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.box-ui {
  flex: none; width: 24px; height: 24px; margin-top: 1px;
  border: 3px solid var(--ink); border-radius: 8px; background: var(--paper);
  display: grid; place-items: center; transition: background .15s, transform .15s;
}
.box-ui svg { opacity: 0; transform: scale(.4); transition: opacity .15s, transform .2s cubic-bezier(.34,1.56,.64,1); }
.check input:checked + .box-ui { background: var(--green); }
.check input:checked + .box-ui svg { opacity: 1; transform: none; }
.check input:focus-visible + .box-ui { outline: 3px solid var(--coral); outline-offset: 2px; }
.check-text { min-width: 0; }
.check-text small { display: block; font-size: 12.5px; color: var(--ink-soft); }
.check input:checked ~ .check-text { color: var(--ink-soft); text-decoration: line-through; text-decoration-thickness: 2px; }

.stay { padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.stay.tokyo { background: var(--yellow-l); }
.stay-top { display: flex; gap: 12px; align-items: center; }
.stay-top svg { flex: none; }
.stay-top h3 { font-weight: 400; font-size: 17px; line-height: 1.35; }
.stay-top p { font-size: 13px; color: var(--ink-soft); }
.kv { display: grid; grid-template-columns: 4.5em 1fr; gap: 3px 8px; font-size: 14px; margin: 0; }
.kv dt { color: var(--ink-soft); }
.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.kv dd.num { font-variant-numeric: tabular-nums; }

/* ── 行李 ── */
.bags { display: grid; gap: 14px; }
.bag { padding: 16px 16px 10px; }
.bag:nth-child(1) { background: var(--mizu-l); }
.bag:nth-child(2) { background: var(--green-l); }
.bag:nth-child(3) { background: var(--yellow-l); }
.bag:nth-child(4) { background: var(--coral-l); }
.bag .check { border-bottom-color: rgba(62,58,57,.15); }

.reset {
  margin-top: 12px; cursor: pointer; background: var(--paper);
  border: 2.5px solid var(--ink); border-radius: 999px; padding: 4px 14px; font-size: 13px;
}
.reset:hover { background: var(--coral-l); }

footer { text-align: center; font-size: 13px; color: var(--ink-soft); display: flex; flex-direction: column; align-items: center; gap: 8px; }

/* ── 插圖動態 ── */
.sway, .bob, .drift, .float, .spin, .roll {
  transform-box: fill-box; transform-origin: center;
}
.drift { animation: drift 9s ease-in-out infinite; }
.drift.d2 { animation-duration: 12s; animation-delay: -4s; }
.bob { animation: bob 3.2s ease-in-out infinite; }
.float { animation: float 4s ease-in-out infinite; }
.sway { transform-origin: 50% 100%; animation: sway 3.6s ease-in-out infinite; }
.roll { animation: roll 2.4s ease-in-out infinite; }
.petal { animation: petal 7s linear infinite; transform-box: fill-box; transform-origin: center; }
.petal.p2 { animation-delay: -2.4s; animation-duration: 8s; }
.petal.p3 { animation-delay: -5s; animation-duration: 6.5s; }
@keyframes drift { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(14px); } }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
@keyframes float { 0%, 100% { transform: translate(0, 0) rotate(-2deg); } 50% { transform: translate(6px, -6px) rotate(2deg); } }
@keyframes sway { 0%, 100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }
@keyframes roll { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(-6px); } }
@keyframes petal {
  0% { transform: translate(0, -10px) rotate(0); opacity: 0; }
  10% { opacity: 1; }
  90% { opacity: 1; }
  100% { transform: translate(-40px, 120px) rotate(300deg); opacity: 0; }
}

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after { animation: none !important; transition: none !important; }
  .petal { opacity: 0; }
  .day-btn[aria-selected="true"] { transform: none; }
}

@media (min-width: 640px) {
  .flights, .two, .bags { grid-template-columns: 1fr 1fr; }
  .stays { display: contents; }
  .day-card { padding: 22px 22px 8px; }
}

/* ── 共用與編輯 ── */
.status {
  border: var(--line); border-radius: var(--r-md); background: var(--yellow-l);
  padding: 10px 14px; font-size: 14px; text-align: center;
}
.nav-edit {
  flex: none; cursor: pointer; padding: 3px 12px; font-size: 14px;
  border: 2.5px solid var(--ink); border-radius: 999px; background: var(--coral);
}
.nav-edit[aria-pressed="true"] { background: var(--green); }
.nav-links { min-width: 0; }
body:not(.editing) .edit-only { display: none !important; }
.edit-btn {
  cursor: pointer; align-self: flex-start; margin-top: 10px;
  border: 2.5px dashed var(--ink); border-radius: 999px; background: var(--paper);
  padding: 3px 14px; font-size: 13.5px;
}
.edit-btn:hover { background: var(--yellow-l); }
.sec-head .edit-btn { margin: 0 0 0 auto; align-self: center; }
.day-btn.add { border-style: dashed; justify-content: center; }
.empty { font-size: 14px; color: var(--ink-soft); padding: 6px 0; }
.empty-day { text-align: center; padding: 18px 0 14px; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.bag { padding: 16px 16px 12px; display: flex; flex-direction: column; }
.panel { display: flex; flex-direction: column; }
.stay-tip { font-size: 13.5px; color: var(--ink-soft); }
.bag-add { border: 3px dashed var(--ink); border-radius: var(--r-lg); background: transparent; cursor: pointer; min-height: 80px; font-size: 15px; }
.bag-add:hover { background: var(--paper); }

dialog {
  width: min(560px, calc(100vw - 24px)); max-height: calc(100dvh - 32px);
  padding: 0; border: var(--line); border-radius: var(--r-lg);
  background: var(--paper); color: var(--ink); font-family: var(--font);
}
dialog::backdrop { background: rgba(62, 58, 57, .35); }
dialog[open] { display: flex; flex-direction: column; }
#ed-form { display: flex; flex-direction: column; min-height: 0; max-height: calc(100dvh - 38px); }
.ed-head { padding: 14px 18px; border-bottom: var(--line); background: var(--yellow); }
.ed-head h3 { font-weight: 400; font-size: 18px; }
.ed-body { padding: 16px 18px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
.ed-foot { display: flex; gap: 8px; padding: 12px 18px; border-top: var(--line); align-items: center; flex-wrap: wrap; }
.ed-foot .grow { flex: 1; }
.btn {
  cursor: pointer; border: 2.5px solid var(--ink); border-radius: 999px;
  padding: 5px 16px; font-size: 15px; background: var(--paper);
}
.btn.primary { background: var(--green); }
.btn.danger { background: var(--coral-l); }
.btn.danger[data-armed="1"] { background: var(--coral); }
.btn:disabled { opacity: .55; cursor: default; }
.ed-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.fld { display: flex; flex-direction: column; gap: 3px; font-size: 13px; color: var(--ink-soft); min-width: 0; }
.fld.wide { grid-column: 1 / -1; }
.fld input, .fld select, .ed-row input:not([type="checkbox"]) {
  width: 100%; min-width: 0; font: inherit; font-size: 16px; color: var(--ink);
  border: 2.5px solid var(--ink); border-radius: 12px; padding: 6px 10px; background: #fff;
}
fieldset { border: 2.5px dashed var(--ink); border-radius: var(--r-md); padding: 10px 12px 12px; margin: 0; }
legend { padding: 0 6px; font-size: 15px; }
.ed-sub { font-size: 15px; font-weight: 400; margin: 4px 0 -4px; }
.ed-rows { display: flex; flex-direction: column; gap: 10px; }
.ed-row {
  display: grid; grid-template-columns: 5.2em 1fr; gap: 6px;
  border: 2.5px solid var(--ink); border-radius: var(--r-md); padding: 10px; background: var(--mizu-l);
}
.ed-row.item-row { grid-template-columns: 1fr; background: var(--green-l); }
.ed-row .wide { grid-column: 1 / -1; }
.ed-tags { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px; }
.pick { cursor: pointer; display: inline-flex; }
.pick input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.pick span { opacity: .4; transition: opacity .12s; }
.pick input:checked + span { opacity: 1; box-shadow: 2px 2px 0 var(--ink); }
.pick input:focus-visible + span { outline: 3px solid var(--coral); outline-offset: 2px; }
.row-tools { grid-column: 1 / -1; display: flex; gap: 6px; justify-content: flex-end; }
.row-tools button { cursor: pointer; font-size: 13px; border: 2px solid var(--ink); border-radius: 999px; background: var(--paper); padding: 1px 10px; }
.add-row { align-self: flex-start; }
.toast {
  position: fixed; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  z-index: 70; max-width: calc(100vw - 32px); width: max-content;
  background: var(--ink); color: var(--paper); border-radius: 999px; padding: 8px 16px; font-size: 14px;
}
.check input:disabled + .box-ui { opacity: .6; }
.check:has(input:disabled) { cursor: default; }
@media (max-width: 420px) { .ed-grid { grid-template-columns: 1fr; } }
[hidden] { display: none !important; }
.io-row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.io-help { font-size: 14px; }
.io-text {
  width: 100%; min-height: 140px; resize: vertical; font: 13px/1.4 ui-monospace, Menlo, Consolas, monospace;
  border: 2.5px solid var(--ink); border-radius: 12px; padding: 8px; background: #fff; color: var(--ink);
}
</style>
</head>
<body>

<nav class="nav" aria-label="主選單">
  <div class="nav-inner">
    <a class="brand" href="#top">
      <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><path d="M3 22 L13 4 L23 22 Z" fill="#FFFCF6" stroke="#3E3A39" stroke-width="2.5" stroke-linejoin="round"/><path d="M9.6 10 L13 4 L16.4 10 L14.6 11.6 L13 10.4 L11.4 11.6 Z" fill="#A8D3E6" stroke="#3E3A39" stroke-width="2" stroke-linejoin="round"/></svg>
      <span id="brand-name">旅行手帖</span>
    </a>
    <div class="nav-links">
      <a href="#flight">航班</a>
      <a href="#plan">行程</a>

  const planeSvg = bg => `<svg width="30" height="24" viewBox="0 0 30 24" aria-hidden="true"><rect width="30" height="24" fill="${bg}"/><path d="M3 12 L11 11 L15 4 H18 L16 11 L24 10.5 L26 8 H27.5 L26.5 12 L27.5 16 H26 L24 13.5 L16 13 L18 20 H15 L11 13 L3 12.6 Z" fill="#FFFCF6" stroke="#3E3A39" stroke-width="2" stroke-linejoin="round"/></svg>`;

  const S = { db: null, info: null, days: [], lists: [], checks: {}, mode: "loading", canWrite: false, writeKnown: null, editing: false, sel: null };

  /* ── 畫面 ── */
  const setHTML = (el, html) => { if (el._h !== html) { el.innerHTML = html; el._h = html; return true; } return false; };
  const forceRender = () => { document.querySelectorAll("*").forEach(el => { if (el._h) el._h = null; }); render(); };
  const tbd = (v, ph = "待填") => v ? esc(v) : (ph ? `<span class="tbd">${ph}</span>` : "");

  function render() {
    renderStatus(); renderHero(); renderFlights(); renderDays(false); renderStay(); renderLists();
    const can = S.canWrite && !!S.db;
    document.body.classList.toggle("editing", S.editing && can);
    const t = $("edit-toggle");
    t.hidden = !can; t.textContent = S.editing ? "完成" : "編輯"; t.setAttribute("aria-pressed", String(S.editing));
    tick();
  }

  function renderStatus() {
    const msg = S.editing ? "編輯模式：按各區塊的虛線按鈕修改，改完按右上角「完成」。" : "";
    $("status").textContent = msg; $("status").hidden = !msg;
  }

  function renderHero() {
    const i = S.info || {};
    $("hero-eyebrow").textContent = i.eyebrow || "";
    $("hero-name").textContent = i.title || "我的旅行";
    $("hero-hl").textContent = i.highlight || "準備中";
    $("brand-name").textContent = i.highlight || "旅行手帖";
    const ds = S.days.filter(d => d.date);
    setHTML($("hero-meta"), ds.length ? `<span class="chip">${dateLabel(ds[0].date)} — ${dateLabel(ds[ds.length - 1].date)}</span><span class="chip">${S.days.length} 天 ${Math.max(S.days.length - 1, 0)} 夜</span>` : "");
  }

  function tick() {
    const dep = taiwanTime(S.info?.departAt), ret = taiwanTime(S.info?.returnAt), now = Date.now();
    const set = (d, h, m, s) => { $("cd-d").textContent = d; $("cd-h").textContent = h; $("cd-m").textContent = m; $("cd-s").textContent = s; };
    if (!dep || isNaN(dep)) { $("cd-title").textContent = "出發時間待填"; set("--", "--", "--", "--"); return; }
    let diff = dep - now;
    $("cd-title").textContent = "距離出發還有";
    if (diff <= 0) { diff = 0; $("cd-title").textContent = ret && now > ret ? "旅程結束，歡迎回家" : "旅行進行中，玩得開心！"; }
    set(Math.floor(diff / 864e5), pad(Math.floor(diff / 36e5) % 24), pad(Math.floor(diff / 6e4) % 60), pad(Math.floor(diff / 1e3) % 60));
  }

  function flightCard(f = {}, out) {
    return `<article class="flight box ${out ? "out" : "back"}">
      <div class="flight-top"><span class="tag ${out ? "t-plane" : "t-metro"}">${out ? "去程" : "回程"}</span>${f.date ? dateLabel(f.date) : '<span class="tbd">日期待填</span>'}<span class="code">${tbd(f.code, "航班號待填")}</span></div>
      <div class="route">
        <div class="port"><b>${esc(f.from || "---")}</b><span>${esc(f.fromName)}</span><span class="t">${tbd(f.fromTime, "--:--")}</span></div>
        <div class="path">${planeSvg(out ? "#E3F1F7" : "#E6F1DF")}</div>
        <div class="port r"><b>${esc(f.to || "---")}</b><span>${esc(f.toName)}</span><span class="t">${tbd(f.toTime, "--:--")}</span></div>
      </div>
      <div class="flight-foot"><span>航空公司 <b>${tbd(f.airline)}</b></span><span>行李 <b>${tbd(f.bag)}</b></span><span>座位 <b>${tbd(f.seat)}</b></span></div>
    </article>`;
  }
  function renderFlights() {
    const fl = S.info?.flights || {};
    setHTML($("flight-cards"), flightCard(fl.out, true) + flightCard(fl.back, false));
  }

  function renderDays(animate) {
    const days = S.days;
    if (!days.some(d => d.id === S.sel)) {
      const today = new Date().toLocaleDateString("sv-SE", { timeZone: "Asia/Tokyo" });
      S.sel = (days.find(d => d.date === today) || days[0])?.id || null;
    }
    setHTML($("days"), days.map((d, i) => `<button class="day-btn" type="button" role="tab" id="tab-${esc(d.id)}" aria-controls="day-card" aria-selected="${d.id === S.sel}" tabindex="${d.id === S.sel ? 0 : -1}" data-day="${esc(d.id)}"><small>Day ${i + 1}</small><strong>${md(d.date)}</strong><span class="wd">${wd(d.date)}</span></button>`).join("")
      + `<button class="day-btn add edit-only" type="button" data-act="day-add" aria-label="新增一天"><strong>＋</strong><small>新增</small></button>`);
    const card = $("day-card");
    const idx = days.findIndex(d => d.id === S.sel), d = days[idx];
    let html;
    if (!d) {
      html = `<div class="empty-day"><p class="empty">${S.mode === "loading" ? "行程載入中…" : "還沒有任何行程。"}</p>${S.mode === "ready" ? '<button class="edit-btn edit-only" type="button" data-act="day-add">新增第一天</button>' : ""}</div>`;
      card.removeAttribute("aria-labelledby");
    } else {
      const stops = d.stops || [];
      html = `<div class="day-head">${ART[d.art] || ART.plane}
          <div><span class="tag ${d.city && d.city !== "東京" ? "t-bus" : "t-plane"} city">${esc(d.city || "東京")}</span>
          <h3>Day ${idx + 1}・${esc(d.title)}</h3>${d.note ? `<p>${esc(d.note)}</p>` : ""}</div>
        </div>
        ${stops.length ? `<ol class="timeline">${stops.map(s => `
          <li class="stop${s.must ? " must" : ""}">
            <span class="stop-time">${esc(s.time)}</span>
            <div class="stop-body">
              <div class="stop-title">${esc(s.name)}${s.must ? ` <span class="must-badge">${STAR}必去</span>` : ""}</div>
              ${s.note ? `<p class="stop-note">${esc(s.note)}</p>` : ""}
              ${(s.tr || []).length ? `<div class="stop-tags">${s.tr.filter(k => T[k]).map(k => `<span class="tag ${T[k][0]}">${T[k][1]}</span>`).join("")}</div>` : ""}
            </div>
          </li>`).join("")}</ol>` : '<p class="empty">這天還沒排行程。</p>'}
        <button class="edit-btn edit-only" type="button" data-act="day-edit" data-id="${esc(d.id)}" style="margin-bottom:12px">編輯這天</button>`;
      card.setAttribute("aria-labelledby", "tab-" + d.id);
    }
    const changed = setHTML(card, html);
    if (animate && changed && !reduce.matches) { card.classList.remove("bounce"); void card.offsetWidth; card.classList.add("bounce"); }
  }

  function renderStay() {
    const s = S.info?.stay || {};
    const rows = [["入住", s.checkin], ["退房", s.checkout], ["地址", s.address], ["交通", s.access], ["房型", s.room], ["訂房", s.booking]];
    setHTML($("stay-card"), `
      <div class="stay-top">
        <svg width="48" height="48" viewBox="0 0 48 48" aria-hidden="true"><rect x="8" y="10" width="32" height="34" rx="4" fill="#FFFCF6" stroke="#3E3A39" stroke-width="3"/><path d="M14 18h6M28 18h6M14 26h6M28 26h6" stroke="#3E3A39" stroke-width="3" stroke-linecap="round"/><rect x="20" y="33" width="8" height="11" fill="#A8D3E6" stroke="#3E3A39" stroke-width="2.5"/><rect x="16" y="4" width="16" height="6" rx="2" fill="#F6D27A" stroke="#3E3A39" stroke-width="2.5"/></svg>
        <div><h3>${tbd(s.name, "住宿名稱待填")}</h3><p>${esc(s.nights)}</p></div>
      </div>
      <dl class="kv">${rows.map(([k, v]) => `<dt>${k}</dt><dd>${tbd(v)}</dd>`).join("")}</dl>
      ${s.tip ? `<p class="stay-tip">${esc(s.tip)}</p>` : ""}
      <button class="edit-btn edit-only" type="button" data-act="stay">編輯住宿</button>`);
  }

  function checkItem(it) {
    return `<li><label class="check"><input type="checkbox" id="c-${esc(it.id)}" data-check="${esc(it.id)}" ${S.checks[it.id] ? "checked" : ""} ${S.canWrite ? "" : "disabled"}><span class="box-ui">${TICK}</span><span class="check-text">${esc(it.text)}${it.sub ? `<small>${esc(it.sub)}</small>` : ""}</span></label></li>`;
  }
  function listPanel(list, id, fallback) {
    const items = list?.items || [], done = items.filter(it => S.checks[it.id]).length;
    return `<h3>${esc(list?.title || fallback)} <span class="count">${done} / ${items.length}</span></h3>
      <div class="progress" aria-hidden="true"><i style="width:${items.length ? done / items.length * 100 : 0}%"></i></div>
      ${items.length ? `<ul class="checks">${items.map(checkItem).join("")}</ul>` : `<p class="empty">${S.mode === "loading" ? "載入中…" : "還沒有項目"}</p>`}
      <button class="edit-btn edit-only" type="button" data-act="list-edit" data-id="${esc(id)}">編輯清單</button>`;
  }
  const bagLists = () => S.lists.filter(l => l.kind === "bag").sort((a, b) => (a.order ?? 0) - (b.order ?? 0));
  function renderLists() {
    const byId = Object.fromEntries(S.lists.map(l => [l.id, l]));
    setHTML($("todo-panel"), listPanel(byId.todo, "todo", "旅途中想做的事"));
    setHTML($("before-panel"), listPanel(byId.before, "before", "出門前一一確認"));
    const bags = bagLists();
    setHTML($("bags"), bags.map(b => `<div class="bag box">${listPanel(b, b.id, "行李")}</div>`).join("")
      + `<button class="bag-add edit-only" type="button" data-act="bag-add">＋ 新增行李分類</button>`);
    const all = bags.flatMap(b => b.items || []), done = all.filter(it => S.checks[it.id]).length;
    $("bag-total").textContent = !all.length ? "" : done === all.length ? "全部打包完成！" : `已打包 ${done} / ${all.length}`;
  }

  /* ── 寫入 ── */
  const chains = {};
  let toastTimer;
  function toast(msg) {
    const t = $("toast"); t.textContent = msg; t.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 3500);
  }
  function fail(e) {
    const c = e?.code;
    if (c === "invalid_argument" && S.writeKnown == null) {
      S.canWrite = false; S.editing = false;
      toast("你沒有編輯權限，請擁有者在分享設定把你設為「參與者」或「編輯者」。");
    } else {
      toast(c === "quota_exceeded" ? "資料空間滿了，請先刪掉一些項目再存。"
        : c === "invalid_argument" ? "這筆資料存不進去，請檢查內容後再試一次。"
        : c === "revoked" ? "目前無法存檔。" : "暫時存不進去，請稍後再試一次。");
    }
    forceRender();
  }
  function write(path, op) {
    const run = (chains[path] || Promise.resolve()).then(op);
    chains[path] = run.catch(() => {});
    return run.then(() => true, e => { fail(e); return false; });
  }
  const clone = o => JSON.parse(JSON.stringify(o || {}));
  const saveInfo = patch => write("trip/info", () => S.db.doc("trip/info").set({ ...clone(S.info), ...patch }));

  /* ── 編輯視窗 ── */
  const dlg = $("editor"), form = $("ed-form"), delBtn = $("ed-delete"), saveBtn = $("ed-save");
  let ed = null;
  const field = (label, name, value, type = "text", wide = false, ph = "") =>
    `<label class="fld${wide ? " wide" : ""}" for="${name}"><span>${label}</span><input id="${name}" name="${name}" type="${type}" value="${esc(value)}" placeholder="${esc(ph)}" autocomplete="off"></label>`;
  const val = name => (form.elements[name]?.value || "").trim();
  const rowVal = (row, f) => (row.querySelector(`[data-f="${f}"]`)?.value || "").trim();

  function openEditor(cfg) {
    ed = cfg;
    $("ed-title").textContent = cfg.title;
    $("ed-body").innerHTML = cfg.body;
    delBtn.hidden = !cfg.del; delBtn.dataset.armed = ""; delBtn.textContent = cfg.delLabel || "刪除";
    saveBtn.disabled = false; saveBtn.textContent = cfg.saveLabel || "儲存";
    dlg.showModal();
    $("ed-body").scrollTop = 0;
  }
  form.addEventListener("submit", async e => {
    e.preventDefault();
    if (!ed) return;
    saveBtn.disabled = true;
    const ok = await ed.save();
    saveBtn.disabled = false;
    if (ok) { dlg.close(); toast(ed.doneMsg || "已儲存"); }
  });
  $("ed-cancel").addEventListener("click", () => dlg.close());
  delBtn.addEventListener("click", async () => {
    if (!delBtn.dataset.armed) { delBtn.dataset.armed = "1"; delBtn.textContent = "再按一次確認刪除"; return; }
    delBtn.disabled = true;
    const ok = await ed.del();
    delBtn.disabled = false;
    if (ok) { dlg.close(); toast("已刪除"); }
  });
  $("ed-body").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    if (b.dataset.add === "stop") { $("ed-rows").insertAdjacentHTML("beforeend", stopRow({})); $("ed-rows").lastElementChild.querySelector("input").focus(); }
    if (b.dataset.add === "item") { $("ed-rows").insertAdjacentHTML("beforeend", itemRow({})); $("ed-rows").lastElementChild.querySelector('[data-f="text"]').focus(); }
    if (b.hasAttribute("data-del-row")) b.closest(".ed-row").remove();
    if (b.hasAttribute("data-up")) { const r = b.closest(".ed-row"); if (r.previousElementSibling) r.parentNode.insertBefore(r, r.previousElementSibling); }
  });

  const rowTools = what => `<div class="row-tools"><button type="button" data-up aria-label="往上移">往上移</button><button type="button" data-del-row aria-label="刪除這${what}">刪除</button></div>`;
  const stopRow = s => `<div class="ed-row stop-row">
      <input data-f="time" value="${esc(s.time)}" placeholder="時間" aria-label="時間">
      <input data-f="name" value="${esc(s.name)}" placeholder="地點／活動" aria-label="地點">
      <input class="wide" data-f="note" value="${esc(s.note)}" placeholder="備註（可空白）" aria-label="備註">
      <div class="ed-tags">${Object.keys(T).map(k => `<label class="pick"><input type="checkbox" data-f="tr" value="${k}" ${(s.tr || []).includes(k) ? "checked" : ""}><span class="tag ${T[k][0]}">${T[k][1]}</span></label>`).join("")}
        <label class="pick"><input type="checkbox" data-f="must" ${s.must ? "checked" : ""}><span class="must-badge">${STAR}必去</span></label></div>
      ${rowTools("一站")}
    </div>`;
  const itemRow = it => `<div class="ed-row item-row">
      <input type="hidden" data-f="id" value="${esc(it.id)}">
      <input data-f="text" value="${esc(it.text)}" placeholder="項目" aria-label="項目">
      <input data-f="sub" value="${esc(it.sub)}" placeholder="小字補充（可空白）" aria-label="補充說明">
      ${rowTools("項")}
    </div>`;

  function editTrip() {
    const i = S.info || {};
    openEditor({
      title: "標題與出發時間",
      body: `<div class="ed-grid">${field("小標", "t_eyebrow", i.eyebrow, "text", true, "TOKYO 2026")}${field("地點", "t_title", i.title, "text", false, "東京")}${field("標語", "t_hl", i.highlight, "text", false, "冬日慢旅")}
        ${field("出發時間（台灣時間）", "t_dep", i.departAt, "datetime-local", true)}${field("回到台灣（台灣時間）", "t_ret", i.returnAt, "datetime-local", true)}</div>`,
      save: () => saveInfo({ eyebrow: val("t_eyebrow"), title: val("t_title"), highlight: val("t_hl"), departAt: val("t_dep"), returnAt: val("t_ret") }),
    });
  }
  const FF = [["date", "日期", "date"], ["code", "航班號"], ["airline", "航空公司"], ["from", "出發代碼", "text", "TPE"], ["fromName", "出發機場", "text", "桃園"], ["fromTime", "起飛", "time"], ["to", "抵達代碼", "text", "HND"], ["toName", "抵達機場", "text", "羽田"], ["toTime", "抵達", "time"], ["bag", "行李額度"], ["seat", "座位"]];
  function editFlights() {
    const fl = S.info?.flights || {};
    openEditor({
      title: "航班資訊",
      body: [["out", "去程"], ["back", "回程"]].map(([p, l]) => `<fieldset><legend>${l}</legend><div class="ed-grid">${FF.map(([k, lab, t, ph]) => field(lab, `${p}_${k}`, fl[p]?.[k], t || "text", false, ph || "")).join("")}</div></fieldset>`).join(""),
      save: () => {
        const flights = {};
        for (const p of ["out", "back"]) { flights[p] = {}; for (const [k] of FF) flights[p][k] = val(`${p}_${k}`); }
        return saveInfo({ flights });
      },
    });
  }
  const SF = [["name", "名稱", true], ["nights", "晚數與日期", true], ["checkin", "入住"], ["checkout", "退房"], ["address", "地址", true], ["access", "交通", true], ["room", "房型"], ["booking", "訂房編號"], ["tip", "小提醒", true]];
  function editStay() {
    const s = S.info?.stay || {};
    openEditor({
      title: "住宿資訊",
      body: `<div class="ed-grid">${SF.map(([k, l, w]) => field(l, "s_" + k, s[k], "text", !!w)).join("")}</div>`,
      save: () => saveInfo({ stay: Object.fromEntries(SF.map(([k]) => [k, val("s_" + k)])) }),
    });
  }
  function editDay(id, isNew) {
    const last = S.days[S.days.length - 1];
    const d = isNew ? { date: last ? nextDay(last.date) : "", city: "東京", art: "plane", stops: [] } : S.days.find(x => x.id === id);
    if (!d) return;
    openEditor({
      title: isNew ? "新增一天" : `編輯 ${md(d.date)}`,
      body: `<div class="ed-grid">${field("日期", "d_date", d.date, "date")}${field("地區", "d_city", d.city)}${field("標題", "d_title", d.title, "text", true)}${field("小提醒", "d_note", d.note, "text", true)}
          <label class="fld wide" for="d_art"><span>插圖</span><select id="d_art" name="d_art">${Object.keys(ART).map(k => `<option value="${k}" ${k === d.art ? "selected" : ""}>${ART_LABEL[k] || k}</option>`).join("")}</select></label></div>
        <h4 class="ed-sub">行程</h4>
        <div class="ed-rows" id="ed-rows">${(d.stops || []).map(stopRow).join("")}</div>
        <button class="btn add-row" type="button" data-add="stop">＋ 新增一站</button>`,
      save: () => {
        const stops = [...form.querySelectorAll(".stop-row")].map(r => ({
          time: rowVal(r, "time"), name: rowVal(r, "name"), note: rowVal(r, "note"),
          tr: [...r.querySelectorAll('[data-f="tr"]:checked')].map(x => x.value),
          must: r.querySelector('[data-f="must"]').checked,
        })).filter(s => s.time || s.name || s.note);
        const body = { date: val("d_date"), city: val("d_city"), title: val("d_title"), note: val("d_note"), art: form.elements.d_art.value, stops };
        if (isNew) { id = S.db.collection("days").doc().id; S.sel = id; }
        return write("days/" + id, () => S.db.doc("days/" + id).set(body));
      },
      del: isNew ? null : () => write("days/" + id, () => S.db.doc("days/" + id).delete()),
      delLabel: "刪除這天",
    });
  }
  function editList(id, isNew) {
    const base = { todo: { kind: "todo", order: 0, title: "旅途中想做的事" }, before: { kind: "before", order: 0, title: "出門前一一確認" } };
    const l = isNew ? { kind: "bag", order: (bagLists().slice(-1)[0]?.order ?? 0) + 1, title: "", items: [] }
      : S.lists.find(x => x.id === id) || { ...base[id], items: [] };
    openEditor({
      title: isNew ? "新增行李分類" : "編輯清單",
      body: `<div class="ed-grid">${field("清單名稱", "l_title", l.title, "text", true, "例如：伴手禮")}</div>
        <h4 class="ed-sub">項目</h4>
        <div class="ed-rows" id="ed-rows">${(l.items || []).map(itemRow).join("")}</div>
        <button class="btn add-row" type="button" data-add="item">＋ 新增項目</button>`,
      save: () => {
        const items = [...form.querySelectorAll(".item-row")].map(r => ({ id: rowVal(r, "id") || uid("i"), text: rowVal(r, "text"), sub: rowVal(r, "sub") })).filter(it => it.text);
        if (isNew) id = S.db.collection("lists").doc().id;
        const kept = new Set(items.map(it => it.id));
        (l.items || []).filter(it => !kept.has(it.id) && S.checks[it.id]).forEach(it => write("checks/" + it.id, () => S.db.doc("checks/" + it.id).delete()));
        return write("lists/" + id, () => S.db.doc("lists/" + id).set({ kind: l.kind, order: l.order ?? 0, title: val("l_title") || l.title || "清單", items }));
      },
      del: !isNew && l.kind === "bag" ? () => write("lists/" + id, () => S.db.doc("lists/" + id).delete()) : null,
      delLabel: "刪除這個分類",
    });
  }

      const next = Object.fromEntries(Object.entries(db.all()).filter(([p]) => p.startsWith("checks/")));
      for (const [p, v] of Object.entries(pkg.data)) if (SAFE_PATH.test(p) && v && typeof v === "object" && !Array.isArray(v)) next[p] = v;
      try { db.replace(next); } catch (e) { fail(e); return false; }
      S.sel = null; forceRender();
      return true;
    },
  }));

  if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
})();
</script>
